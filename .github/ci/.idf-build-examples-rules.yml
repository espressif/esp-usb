# Manifest file for build_idf_examples.yml CI workflow

examples/peripherals/usb/device:
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1
    - if: IDF_VERSION < "6.2.0"
      temporary: true
      reason: Device esp_tinyusb examples are disabled on IDF release-v5.3 through release-v6.1

examples/peripherals/usb/device/tusb_ncm:
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1 or SOC_WIFI_SUPPORTED != 1
    - if: IDF_VERSION < "6.2.0"
      temporary: true
      reason: Device esp_tinyusb examples are disabled on IDF release-v5.3 through release-v6.1

examples/peripherals/usb/device/tusb_cdc_acm_wakeup:
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1 or SOC_PM_SUPPORT_USB_WAKEUP != 1
    - if: IDF_VERSION < "6.2.0"
      temporary: true
      reason: Device esp_tinyusb examples are disabled on IDF release-v5.3 through release-v6.1

examples/peripherals/usb/host:
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1

examples/peripherals/usb/host/uvc:
  enable:
    - if: (IDF_VERSION >= "5.5.0")
      reason: Run UVC example starts using UVC driver 2.0 only on IDF version 5.5
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1

examples/network/sta2eth:
  disable:
    - if: SOC_USB_OTG_SUPPORTED != 1 or SOC_WIFI_SUPPORTED != 1
